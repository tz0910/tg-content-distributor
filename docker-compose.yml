services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tg_content_distributor
      POSTGRES_USER: tg
      POSTGRES_PASSWORD: tgdemo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    volumes:
      - uploads-data:/app/public/uploads
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npm run start"

  worker:
    build: .
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    volumes:
      - uploads-data:/app/public/uploads
    command: sh -c "npx prisma migrate deploy && npm run worker"

volumes:
  postgres-data:
  redis-data:
  uploads-data:
